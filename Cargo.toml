[package]
name = "git-ai"
version = "0.0.0-local"
edition = "2024"

[profile.release]
opt-level = 3
debug = false
lto = true
strip = "debuginfo"
panic = 'unwind'
incremental = false
codegen-units = 1
rpath = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
git2 = "0.21.0"
handlebars = "6.4.4"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
self_update = { version = "1.3", default-features = false, features = [
  "github",
  "reqwest",
  "rustls",
  "archive-tar",
  "compression-tar-gz",
] }
semver = "1.0.27"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
